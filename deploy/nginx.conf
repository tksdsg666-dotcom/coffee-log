# /etc/nginx/conf.d/coffee.conf
#
# 源站配置。TLS 由 Cloudflare 那一层终结，所以这里是明文。
#
# **听 8080 不是 80**：这台机器上 80 被 x-ui 的 xray 占着，动它就会打断
# 代理。Cloudflare 默认按协议回源（http→80 / https→443），所以配了一条
# Origin Rule 把 coffee.thinker.win 的目标端口改成 8080，绕开 80。
# 装 nginx 时还要把 nginx.conf 里默认 server 的 listen 80 也挪到 8080，
# 否则它起不来。
#
# 三条规则撑起整个 PWA：
#   1. 未知路径回落到 index.html —— 路由在前端，服务器上没有 /record/edit 这个文件
#   2. 带哈希的资源可以永久缓存，index.html 和 sw.js 绝对不能
#   3. .wasm 要带正确的 MIME，否则流式编译会退化成先下完再编译

server {
    listen 8080;
    listen [::]:8080;
    server_name coffee.thinker.win;

    root /var/www/coffee;
    index index.html;

    # 文件名里带内容哈希，改了内容就是另一个文件名，可以随便缓存。
    location /_expo/  { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # 这三个名字固定不变。一旦被缓存住，新版本就永远发不出去。
    location = /index.html    { add_header Cache-Control "no-cache"; }
    location = /sw.js         { add_header Cache-Control "no-cache"; }
    location = /manifest.json { add_header Cache-Control "no-cache"; }

    # nginx 1.21.5 之前的 mime.types 里没有 wasm。
    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

    # 注意：不要加 Cross-Origin-Embedder-Policy。SQLite 走的是 OPFS 的
    # access handle pool，不需要 SharedArrayBuffer，而 COEP 会把没带
    # CORP 头的资源全部挡掉。
}
